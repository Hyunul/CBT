name: Validate and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew test bootJar --no-daemon
        working-directory: cbt-be
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cbt-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cbt-fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit
  integration-checks:
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable environment
        run: |
          python3 - <<'PY'
          import os, secrets
          from pathlib import Path
          content = '\n'.join([
            'DB_PASSWORD=' + secrets.token_hex(24),
            'DB_ROOT_PASSWORD=' + secrets.token_hex(24),
            'JWT_SECRET=' + secrets.token_hex(32),
            'HTTP_PORT=18080',
            'FRONTEND_URL=http://localhost:18080',
          ])
          Path(os.environ['RUNNER_TEMP'], 'cbt.env').write_text(content)
          PY
      - run: docker compose --env-file "$RUNNER_TEMP/cbt.env" -p cbt-validation-ci up -d --build --wait --wait-timeout 240
      - run: python3 scripts/smoke_test.py --env-file "$RUNNER_TEMP/cbt.env" --project cbt-validation-ci
      - name: Clean disposable stack
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/cbt.env" -p cbt-validation-ci down --volumes
  build-and-push:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [integration-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./cbt-be
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cbt-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./cbt-fe
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cbt-frontend:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml,docker-compose.https.yml,nginx
          target: ~/CBT
      - uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,IMAGE_TAG
          script: |
            set -eu
            cd ~/CBT
            test -f .env
            docker compose config --quiet
            docker compose pull
            docker compose up -d --no-build --wait --wait-timeout 240
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload
