spring:
    profiles:
        default: dev
    data:
        redis:
            timeout: 3000
    jpa:
        properties:
            hibernate:
                # 채점·자동 저장의 답안 UPDATE 를 묶어 보낸다. MySQL 은 URL 의 rewriteBatchedStatements=true 가 있어야
                # 실제로 왕복이 줄어든다. 답안 INSERT 는 IDENTITY 키라 Hibernate 가 배치하지 않는다.
                jdbc:
                    batch_size: 50
                order_updates: true
                order_inserts: true
jwt:
    secret: ${JWT_SECRET}
    expiration: 900000
    refresh-expiration: 604800000
app:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
server:
    forward-headers-strategy: framework
springdoc:
    api-docs:
        enabled: ${API_DOCS_ENABLED:false}
    swagger-ui:
        enabled: ${API_DOCS_ENABLED:false}
management:
    endpoints:
        web:
            exposure:
                # prometheus 는 Docker 내부망의 Prometheus 만 수집한다. nginx 가 /actuator 를 라우팅하지 않아 외부에서 닿지 않는다.
                include: health,prometheus
    metrics:
        tags:
            application: cbt
        distribution:
            # 엔드포인트별 p95/p99 를 Prometheus 에서 histogram_quantile 로 계산하려면 버킷이 필요하다
            percentiles-histogram:
                http.server.requests: true
