spring:
    profiles:
        default: dev
    data:
        redis:
            timeout: 3000
jwt:
    secret: ${JWT_SECRET}
    expiration: 900000
    refresh-expiration: 604800000
app:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
server:
    forward-headers-strategy: framework
springdoc:
    api-docs:
        enabled: ${API_DOCS_ENABLED:false}
    swagger-ui:
        enabled: ${API_DOCS_ENABLED:false}
management:
    endpoints:
        web:
            exposure:
                include: health
