limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=attempt_start:10m rate=1r/s;
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_name _;
    client_max_body_size 2m;
    set $frontend_target frontend:3000;
    set $backend_target backend:8080;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://$backend_target;
    }
    location /api/attempts/start/ {
        limit_req zone=attempt_start burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://$backend_target;
    }
    location /api/ { proxy_pass http://$backend_target; }
    location /oauth2/ { proxy_pass http://$backend_target; }
    location /login/oauth2/code/ { proxy_pass http://$backend_target; }
    location / { proxy_pass http://$frontend_target; }
}

server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
